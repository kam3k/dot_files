# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'Morantron/tmux-fingers'

# Force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf

# Proper vim colours in tmux
set -a terminal-features "foot:RGB"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Create status bar
set-option -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=#999999" # Faded grey foreground
set -g status-left "#[fg=colour5,bold]#S #[fg=default,none]"
set -g status-left-length 20
setw -g window-status-format "#[fg=#666666]#I #W" 
setw -g window-status-current-format "#[fg=colour6]#I #W"
set -g status-right ""

# Pane borders
set-option -g pane-border-style "bg=default"
set-option -ag pane-border-style "fg=colour8"
set-option -g pane-active-border-style "bg=default"
set-option -ag pane-active-border-style "fg=colour5"

# Move windows left and right
bind-key w swap-window -t +1
bind-key W swap-window -t -1

# Go to previous session
unbind p 
bind-key p switch-client -l

# Split panes using \ and -
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Kill window
bind q killp

# Enable mouse mode
set -g mouse on

# Don't rename windows automatically
set-option -g allow-rename off
set-window-option -g automatic-rename off

# Renumber windows automatically
set-option -g renumber-windows on

# Vi mode for pane searching and copying
set-window-option -g mode-keys vi

# Fingers setup
set -g @fingers-main-action 'nohup xclip -selection clipboard'

# Ressurect vim sessions, pane contents and processes
set -g @resurrect-capture-pane-contents 'on'

# Last saved environment is automatically restored when tmux is started
set -g @continuum-restore 'on'

# Seamless navigation between vim and tmux with C-hjkl
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
